<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baixar Pasta do Pinterest</title>
<style>
  :root { --bg:#020a02; --fg:#33ff66; --muted:#1fa443; --card:#041504; --accent:#33ff66; --ok:#33ff66; --err:#ff5555; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 ui-monospace, Menlo, monospace;
         display:flex; justify-content:center; padding:48px 16px; }
  main { width:100%; max-width:640px; }
  h1 { margin:0 0 4px; font-size:1.6rem; text-transform:uppercase; }
  h1::before { content:"> "; }
  h1::after { content:"_"; animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  p.sub { margin:0 0 24px; color:var(--muted); }
  form { display:flex; gap:8px; }
  input[type=url] { flex:1; min-width:0; padding:12px 14px; font:inherit; color:inherit; background:var(--card);
          border:1px solid var(--muted); border-radius:0; outline:none; }
  input[type=url]:focus { border-color:var(--accent); }
  button { padding:12px 20px; font:inherit; font-weight:600; color:#021a06; text-transform:uppercase; background:var(--accent);
           border:0; border-radius:0; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  #cancel { color:var(--fg); background:var(--card); border:1px solid var(--muted); }
  #cancel[hidden] { display:none; }
  #openFolder { color:var(--fg); background:var(--card); border:1px solid var(--muted); }
  #status.cancel { color:var(--muted); }
  #preview { margin-top:12px; padding:10px 14px; background:var(--card); }
  #preview[hidden] { display:none; }
  #preview b { display:block; line-height:1.3; overflow-wrap:anywhere; }
  #preview small { color:var(--muted); overflow-wrap:anywhere; }
  #choice { display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; margin-top:12px; padding:10px 14px;
            background:var(--card); font-size:.95rem; }
  #choice label { cursor:pointer; }
  #choice input { accent-color:var(--accent); }
  #choice small { width:100%; color:var(--muted); }
  #choice small[hidden], #browser[hidden] { display:none; }
  select { padding:6px 12px; font:inherit; color:inherit; background:var(--bg); border:1px solid var(--muted); border-radius:0; }
  #actions { display:flex; align-items:center; gap:12px; margin:16px 0 8px; }
  #actions #status { margin:0; flex:1; }
  #status { margin:16px 0 8px; font-weight:600; min-height:1.5em; }
  #status.ok { color:var(--ok); } #status.err { color:var(--err); }
  pre { margin:0; padding:14px; background:var(--card); border-radius:0; max-height:360px;
        overflow:auto; font:12.5px/1.5 ui-monospace, Menlo, monospace; white-space:pre-wrap; word-break:break-all; }
  pre:empty { display:none; }
</style>
</head>
<body>
<main>
  <h1>Baixar pasta do Pinterest</h1>
  <p class="sub">Cole o link de uma pasta do Pinterest e baixe todas as imagens.<br>Salva em: <code>~/Downloads/downloads-baixar-pasta-pinterest</code></p>
  <form id="form">
    <input id="url" type="url" placeholder="https://www.pinterest.com/usuario/nome-da-pasta/" required autofocus>
    <button id="btn">Baixar</button>
  </form>
  <div id="preview" hidden>
    <b id="what"></b><small id="detail"></small>
  </div>
  <div id="choice">
    <label><input type="checkbox" id="secret"> Pasta secreta: usar o login do navegador</label>
    <select id="browser" aria-label="Navegador" hidden>
      <option value="chrome">Chrome</option>
      <option value="safari">Safari</option>
      <option value="firefox">Firefox</option>
      <option value="edge">Edge</option>
      <option value="brave">Brave</option>
    </select>
    <small id="secretHint" hidden>Escolha o navegador em que você está logado no Pinterest.</small>
  </div>
  <div id="actions">
    <div id="status"></div>
    <button id="openFolder" type="button">Abrir pasta</button>
    <button id="cancel" type="button" hidden>Cancelar</button>
  </div>
  <pre id="log"></pre>
</main>
<script>
  const form = document.getElementById('form'), url = document.getElementById('url'),
        btn = document.getElementById('btn'), status = document.getElementById('status'),
        log = document.getElementById('log'), cancel = document.getElementById('cancel');
  const secret = document.getElementById('secret'), browser = document.getElementById('browser'),
        secretHint = document.getElementById('secretHint'), openFolder = document.getElementById('openFolder');
  openFolder.addEventListener('click', () => fetch('/open', { method: 'POST' }).catch(() => {}));

  // Pasta secreta: lembra se estava marcada e qual navegador.
  function showSecret() { browser.hidden = secretHint.hidden = !secret.checked; }
  try {
    secret.checked = localStorage.getItem('secret') === '1';
    if (localStorage.getItem('browser')) browser.value = localStorage.getItem('browser');
  } catch {}
  showSecret();
  secret.addEventListener('change', () => { showSecret(); try { localStorage.setItem('secret', secret.checked ? '1' : '0'); } catch {} });
  browser.addEventListener('change', () => { try { localStorage.setItem('browser', browser.value); } catch {} });

  // Diz o que o link vai baixar: pasta, seção, perfil inteiro ou um pin só.
  const preview = document.getElementById('preview');
  function describe(link) {
    try {
      const u = new URL(link), host = u.hostname.toLowerCase();
      if (host === 'pin.it') return ['Link curto do Pinterest', 'o gallery-dl descobre se é pasta ou pin'];
      if (!/(^|\.)pinterest\.[a-z.]+$/.test(host)) return null;
      const parts = u.pathname.split('/').filter(Boolean).map(decodeURIComponent);
      if (parts[0] === 'pin' && parts[1]) return ['Um pin só', 'pin ' + parts[1]];
      if (parts[0] === 'search') return ['Busca', u.searchParams.get('q') || ''];
      if (parts.length === 1 || parts[1] === '_saved') return ['Perfil inteiro: ' + parts[0], 'todas as pastas'];
      if (parts[1] === 'pins') return ['Todos os pins de ' + parts[0], ''];
      if (parts[1] === '_created') return ['Pins criados por ' + parts[0], ''];
      if (parts.length === 2) return ['Pasta: ' + parts[1], 'de ' + parts[0]];
      if (parts.length >= 3) return ['Seção: ' + parts[2], 'da pasta ' + parts[1] + ', de ' + parts[0]];
    } catch {}
    return null;
  }
  url.addEventListener('input', () => {
    const info = describe(url.value.trim());
    preview.hidden = !info;
    if (info) { document.getElementById('what').textContent = info[0]; document.getElementById('detail').textContent = info[1]; }
  });

  let cancelled = false;
  cancel.addEventListener('click', async () => {
    cancelled = true; cancel.disabled = true; status.textContent = 'Cancelando...';
    await fetch('/cancel', { method: 'POST' }).catch(() => {});
  });

  // O gallery-dl escreve o caminho de cada arquivo baixado; os que já existiam vêm com "# " na frente.
  const PATH = /^(?:\/|[A-Za-z]:\\)/, SKIP = /^# (?:\/|[A-Za-z]:\\)/;
  const counted = (fresh, old) => fresh + (fresh === 1 ? ' novo' : ' novos') + (old ? ', ' + old + ' já na pasta' : '');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    cancelled = false; cancel.disabled = false; cancel.hidden = false;
    btn.disabled = true; log.textContent = ''; status.className = ''; status.textContent = 'Procurando as imagens...';
    let text = '', pending = '', fresh = 0, old = 0;
    try {
      const res = await fetch('/download', { method: 'POST', body: JSON.stringify({
        url: url.value.trim(), browser: secret.checked ? browser.value : '',
      }) });
      if (!res.ok) throw new Error(await res.text() || res.statusText);
      const reader = res.body.getReader(), dec = new TextDecoder();
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        const chunk = dec.decode(value, { stream: true });
        text += chunk; pending += chunk;
        const lines = pending.split('\n'); pending = lines.pop();
        for (const l of lines) { if (PATH.test(l)) fresh++; else if (SKIP.test(l)) old++; }
        if (fresh || old) status.textContent = 'Baixando... ' + counted(fresh, old);
        // Pasta grande: mostra só o fim do log, para a página não travar.
        const shown = text.replace(/\n__EXIT__-?\d+$/, '');
        log.textContent = shown.length > 60000 ? '…\n' + shown.slice(-60000) : shown;
        log.scrollTop = log.scrollHeight;
      }
      const code = (text.match(/__EXIT__(-?\d+)$/) || [])[1];
      if (cancelled) { status.className = 'cancel'; status.textContent = 'Cancelado. O que já baixou continua na pasta.'; }
      else if (code === '0') { status.className = 'ok'; status.textContent = 'Pronto! ✔ ' + counted(fresh, old); url.value = ''; preview.hidden = true; }
      else { status.className = 'err'; status.textContent = 'Deu erro (veja o log abaixo).'; }
    } catch (err) {
      if (cancelled) { status.className = 'cancel'; status.textContent = 'Cancelado.'; }
      else { status.className = 'err'; status.textContent = 'Erro: ' + err.message; }
    } finally { btn.disabled = false; cancel.hidden = true; }
  });
</script>
</body>
</html>
